server {
    listen 3000;
    server_name localhost;

    # 1. Раздача статических файлов фронтенда (Vite)
    location / {
        root /usr/share/nginx/html;
        # Указываем auth.html как главный стартовый файл
        index auth.html; 
        
        try_files $uri $uri.html $uri/ =404; 
    }

    # 2. Проксирование запросов к бэкенду
    location /api/ {
        proxy_pass http://web_app:8000/;

        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Изменяет путь куки, чтобы браузер считал, что её установил фронтенд
        proxy_cookie_path / /api/; 
        
    }
}
