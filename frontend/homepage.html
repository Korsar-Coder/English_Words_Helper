<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>English Helper</title>
    <script src="src/homepage.js" type="module"></script>
    <link rel="icon" type="image/x-icon" href="images/owl_icon.ico" />
    <link rel="stylesheet" href="src/homepage.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <button id="logout-button">Выйти из Аккаунта</button>
    <div class="main-content">
      <!-- <input type="submit" value="Получить слова" id="get-words-button" /> -->
      <h1 id="welcome-text">Добро пожаловать!</h1>
      <div id="words-container"></div>
      <button id="start-quiz-button">Начать викторину</button>
    </div>
    <template id="add-word-template">
      <div class="word-card add-word-form-card">
        <input
          type="text"
          id="new-origin"
          placeholder="English word"
          class="quiz-input"
          minlength="2"
          maxlength="20"
          required
        />
        <input
          type="text"
          id="new-translation"
          placeholder="Перевод (опционально)"
          class="quiz-input"
        />
        <div class="form-buttons">
          <button id="save-word-btn" class="form-btn save">Сохранить</button>
          <button id="cancel-word-btn" class="form-btn cancel">Отмена</button>
        </div>
      </div>
    </template>
  </body>
</html>
