services:
  # МИКРОСЕРВИС БАЗЫ ДАННЫХ (PostgreSQL)
  db:
    image: postgres:15-alpine
    container_name: postgres_db_container
    restart: always
    environment:
      - POSTGRES_USER=${USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_DB=${DATABASE_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USER} -d ${DATABASE_NAME}"]
      interval: 3s
      timeout: 3s
      retries: 5

  # МИКРОСЕРВИС БЭКЕНДА (FastAPI + Python 3.14)
  web_app:
    build: .
    container_name: python_backend_container 
    expose:
      - "8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

  # МИКРОСЕРВИС ФРОНТЕНДА (Vite + Nginx)
  frontend:
    build:
      context: ./frontend
    container_name: vite_frontend_container
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - web_app

volumes:
  postgres_data: 