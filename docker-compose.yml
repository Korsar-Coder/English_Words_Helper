services:
  # 1. МИКРОСЕРВИС БАЗЫ ДАННЫХ (PostgreSQL)
  db:
    image: postgres:15-alpine
    container_name: postgres_db_container
    restart: always
    environment:
      - POSTGRES_USER=${USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_DB=${DATABASE_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USER} -d ${DATABASE_NAME}"]
      interval: 3s
      timeout: 3s
      retries: 5

  # 2. МИКРОСЕРВИС ОФЛАЙН-ПЕРЕВОДЧИКА (LibreTranslate)
  translator:
    image: libretranslate/libretranslate:v1.5.1
    container_name: offline_translator_container
    restart: always
    expose:
      - "5000"                        
    environment:
      - LT_LOAD_ONLY=en,ru            
      - LT_UPDATE_MODELS=true         
    volumes:
      - translator_data:/home/libretranslate/.local 
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # 3. МИКРОСЕРВИС БЭКЕНДА (FastAPI + Python 3.14)
  web_app:
    build: .
    container_name: python_backend_container
    restart: always
    expose:
      - "8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      translator:
        condition: service_healthy

  # 4. МИКРОСЕРВИС ФРОНТЕНДА (Vite + Nginx)
  frontend:
    build:
      context: ./frontend
    container_name: vite_frontend_container
    restart: always
    ports:
      - "80:80"
    depends_on:
      - web_app

volumes:
  postgres_data:
  translator_data:   